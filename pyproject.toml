[project]
name = "lookbrief"
version = "0.1.0"
description = "Look Brief: a measured, artist-confirmed wedding makeup brief built on the Perfect Corp YouCam API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "mediapipe>=0.10.14",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "axe-playwright-python>=0.1.8",
]

[project.scripts]
lookbrief = "lookbrief.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookbrief"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser smoke tests (Playwright)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # report text templates
