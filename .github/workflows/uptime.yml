name: Uptime (demo URL during judging)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Root page and health answer 200, samples present
        run: |
          set -euo pipefail
          url=https://lookbrief.retailbox-automation.com
          curl -fsS -o /dev/null -w "root %{http_code} in %{time_total}s\n" "$url/"
          curl -fsS "$url/healthz" | tee health.json
          python3 -c "import json; d=json.load(open('health.json')); assert d['ok'] and len(d['samples']) == 3, d"
